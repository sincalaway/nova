/* Reference-aligned toolbar, clearer navigation, and balanced spacing */
:root{--rail:92px;--tile-size:56px;--tile-gap:13px}
.rail{width:var(--rail);padding:10px 0 12px;background:rgba(7,15,27,.73)}
.rail-brand{height:72px;margin-bottom:9px}
.rail-brand img{width:46px;height:46px;border-radius:16px;filter:drop-shadow(0 5px 13px rgba(68,178,255,.32))}
.rail-links{gap:5px;padding:0 7px}
.rail-link,.rail-bottom button{min-height:58px;border-radius:12px;gap:5px;font-size:11px}
.rail-link svg,.rail-bottom svg{width:23px;height:23px}
.rail-link.active{border-left:0;background:linear-gradient(135deg,rgba(96,176,255,.24),rgba(148,129,255,.15));box-shadow:inset 0 0 0 1px rgba(210,232,255,.12)}
.rail-emoji{font-size:21px;line-height:23px}
.rail-system{margin-top:5px}
.rail-bottom{padding:0 7px;gap:6px}
.rail-bottom button{min-height:55px}
.rail-divider{width:50%;margin:5px auto}
.workspace{padding:20px 30px 60px}
.top-actions{display:none}
.top-toolbar{width:min(820px,100%);min-height:82px;display:flex;align-items:flex-start;justify-content:center;gap:clamp(5px,1.4vw,17px);margin:1px auto 8px;flex:none}
.tool-item{width:clamp(66px,8.5vw,92px);min-width:0;border:0;padding:0 2px;background:transparent;color:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:550;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;transition:transform .18s,opacity .18s}

.tool-icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;box-shadow:0 7px 18px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.18);transition:transform .18s,box-shadow .18s}
.tool-item:hover .tool-icon{transform:translateY(-1px) scale(1.035);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.tool-icon svg{width:35px;height:35px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tool-paper{background:#fff;color:#3e9ef4}
.tool-sky{background:linear-gradient(145deg,#fff,#eefaff);color:#43a7df}

.tool-plus svg{width:38px;height:38px;stroke-width:2}

.calendar-mark b{font-size:13px;font-weight:700}.calendar-mark strong{font-size:19px;color:#17202b;margin-top:2px}
.hero{margin-top:7px}
.bookmark-grid{margin-top:22px}
.dock{display:none!important}

/* System-settings secondary menu and editable sidebar folders */
.top-toolbar{display:none!important}
.rail-category-wrap{position:relative;width:100%}
.rail-category-wrap>.rail-link{width:100%}
.rail-category-actions{position:absolute;z-index:3;right:3px;top:3px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.rail-category-wrap:hover .rail-category-actions,.rail-category-wrap:focus-within .rail-category-actions{opacity:1}
.rail-category-actions button{width:17px;height:17px;padding:0;border:0;border-radius:5px;background:rgba(7,15,27,.88);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center}

.shortcut-card{min-width:0;border:1px solid #e7ebf0;border-radius:10px;padding:12px;background:linear-gradient(145deg,#fff,#fafbfd)}
.shortcut-card strong{display:block;color:#30343b;font-size:12px;margin-bottom:5px}
.shortcut-card p{min-height:32px;margin:0 0 9px;color:#737a84;font-size:10px;line-height:1.6}
.shortcut-actions{display:flex;gap:6px;flex-wrap:wrap}
.shortcut-card .small-btn{min-width:0;padding:7px 10px;font-size:10px}
.category-chip{padding:5px 6px 5px 8px;gap:6px}
.category-chip-name{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.category-chip button{width:20px;height:20px;padding:0;border:0;border-radius:5px;background:#e4edf7;color:#4d6278;font-size:11px;line-height:1}

/* Bookmark right-click menu, per-item layouts, and pinned-bookmark Dock */
.bookmark-grid{grid-auto-rows:76px}
.bookmark[data-layout]:not([data-layout="1x1"]) .bookmark-link{height:100%;min-height:76px}
.bookmark[data-layout="2x1"] .bookmark-link,.bookmark[data-layout="2x2"] .bookmark-link,.bookmark[data-layout="2x4"] .bookmark-link{flex-direction:row;gap:9px;padding:5px 8px}
.bookmark[data-layout="2x1"] .favicon,.bookmark[data-layout="2x2"] .favicon,.bookmark[data-layout="2x4"] .favicon{width:60px;height:60px;flex:none}
.bookmark[data-layout="2x1"] .bookmark-label,.bookmark[data-layout="2x2"] .bookmark-label,.bookmark[data-layout="2x4"] .bookmark-label{white-space:normal;overflow-wrap:anywhere;text-align:left}
.bookmark-context-menu{display:none;position:fixed;z-index:50;width:190px;max-height:calc(100vh - 16px);overflow:visible;padding:6px;border:1px solid rgba(255,255,255,.55);border-radius:11px;background:rgba(237,243,247,.96);color:#273642;box-shadow:0 12px 35px rgba(0,0,0,.28);backdrop-filter:blur(16px);font-size:12px}
.bookmark-context-menu.open{display:block}
.context-item{position:relative;width:100%;min-height:31px;display:flex;align-items:center;gap:8px;padding:6px 8px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;font-size:12px;line-height:1.35}
.context-item:hover,.context-item:focus{background:rgba(70,130,180,.16);outline:0}
.context-icon{width:16px;flex:none;text-align:center;color:#334756;font-size:14px}
.context-arrow{margin-left:auto;color:#687987;font-size:17px;line-height:1}
.context-submenu-trigger{position:relative}
.bookmark-submenu{display:none;position:absolute;z-index:2;left:calc(100% - 2px);top:-4px;width:150px;max-height:240px;overflow:auto;padding:5px;border:1px solid rgba(255,255,255,.55);border-radius:9px;background:rgba(237,243,247,.97);box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(16px)}
.context-submenu-trigger:hover .bookmark-submenu,.context-submenu-trigger:focus-within .bookmark-submenu{display:block}
.bookmark-context-menu.flip-submenu .bookmark-submenu{left:auto;right:calc(100% - 2px)}
.context-layout{padding:5px 8px 4px}
.context-layout-title{display:flex;align-items:center;gap:8px;min-height:24px;color:#3c4b57}
.layout-options{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 0 22px}
.layout-options button{min-width:36px;padding:3px 6px;border:0;border-radius:10px;background:#e0e6eb;color:#334450;font-size:10px;line-height:1.3}
.layout-options button:hover,.layout-options button.selected{background:#8bbde4;color:#17344d}
.context-divider{height:1px;margin:4px 5px;background:rgba(48,65,78,.14)}
.context-delete{color:#b63d3d}.context-delete .context-icon{color:#b63d3d}
.dock{display:none!important;max-width:calc(100vw - var(--rail) - 20px);overflow:auto;scrollbar-width:thin}
.dock.has-bookmarks{display:flex!important}
.dock .dock-btn,.dock .dock-sep{display:none!important}
.dock-bookmarks{display:flex;align-items:center;gap:7px}
.dock-bookmark{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.93);box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform .16s}
.dock-bookmark:hover{transform:translateY(-4px)}
.dock-bookmark .favicon{width:36px;height:36px;border-radius:9px;box-shadow:none;font-size:14px}

@media(max-width:900px){.bookmark-grid{grid-auto-rows:72px}}
@media(max-width:560px){.bookmark-grid{grid-auto-rows:67px}.bookmark-context-menu{width:182px}.bookmark-submenu{width:136px}.dock{bottom:31px;max-width:calc(100vw - var(--rail) - 10px)}.dock-bookmark{width:36px;height:36px}.dock-bookmark .favicon{width:31px;height:31px}}

</style>

function closeSettings(){$('#settingsOverlay').classList.remove('open');}
function refreshBookmarkCategories(selected='工具'){const select=$('#bookmarkCategory');select.innerHTML=state.categories.map(cat=>`<option value="${esc(cat.name)}">${esc(cat.name)}</option>`).join('');select.value=state.categories.some(cat=>cat.name===selected)?selected:(state.categories[0]?.name||'工具');}
function openBookmark(index=-1){editingIndex=index;const b=index<0?{name:'',url:'https://',category:activeCategory==='全部'?(state.categories[0]?.name||'工具'):activeCategory,icon:''}:state.bookmarks[index];$('#bookmarkModalTitle').textContent=index<0?'添加书签':'编辑书签';$('#bookmarkName').value=b.name||'';$('#bookmarkUrl').value=b.url||'';refreshBookmarkCategories(b.category);$('#bookmarkIcon').value=b.icon||'';$('#deleteBookmark').style.display=index<0?'none':'block';$('#bookmarkOverlay').classList.add('open');setTimeout(()=>$('#bookmarkName').focus(),40);}
function closeBookmark(){$('#bookmarkOverlay').classList.remove('open');}
function openCategory(name='') {const category=state.categories.find(cat=>cat.name===name);editingCategoryName=category?.name||'';$('#categoryTitle').textContent=category?'编辑文件夹':'添加文件夹';$('#categoryName').value=category?.name||'';$('#categoryIcon').value=category?.icon||'✦';$('#categorySave').textContent=category?'保存修改':'保存';$('#categoryOverlay').classList.add('open');setTimeout(()=>$('#categoryName').focus(),30);}
function closeCategory(){$('#categoryOverlay').classList.remove('open');}
function deleteCategory(name){const remaining=state.categories.filter(cat=>cat.name!==name);if(remaining.length===state.categories.length)return;const destination=remaining[0]||{name:'未分类',icon:'📁',iconCustom:true};const count=state.bookmarks.filter(bookmark=>bookmark.category===name).length;const message=count?`删除「${name}」文件夹？其中 ${count} 个书签会保留并移动到「${destination.name}」。`:`删除「${name}」文件夹？`;if(!window.confirm(message))return;state.categories=remaining.length?remaining:[destination];if(count)state.bookmarks.forEach(bookmark=>{if(bookmark.category===name)bookmark.category=destination.name;});if(activeCategory===name)activeCategory='全部';save();renderRail();renderBookmarks();refreshBookmarkCategories();if($('#settingsOverlay').classList.contains('open'))renderSettings('tags');showToast(`已删除「${name}」文件夹`);}
$('#categoryForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#categoryName').value.trim(),icon=$('#categoryIcon').value.trim()||'✦';if(!name)return;if(state.categories.some(cat=>cat.name.toLocaleLowerCase()===name.toLocaleLowerCase()&&cat.name!==editingCategoryName)){showToast('这个文件夹名称已经存在');return;}if(editingCategoryName){const oldName=editingCategoryName,category=state.categories.find(cat=>cat.name===oldName);if(!category)return;category.name=name;category.icon=icon;category.iconCustom=true;state.bookmarks.forEach(bookmark=>{if(bookmark.category===oldName)bookmark.category=name;});if(activeCategory===oldName)activeCategory=name;save();renderRail();renderBookmarks();refreshBookmarkCategories(name);closeCategory();if($('#settingsOverlay').classList.contains('open'))renderSettings('tags');showToast(`已更新「${name}」文件夹`);}else{state.categories.push({name,icon,iconCustom:true});activeCategory=name;save();renderRail();renderBookmarks();refreshBookmarkCategories(name);closeCategory();showToast(`已添加「${name}」文件夹`);}});$('#closeCategory').onclick=closeCategory;$('#categoryOverlay').addEventListener('click',e=>{if(e.target===$('#categoryOverlay'))closeCategory();});
$('#bookmarkForm').addEventListener('submit',e=>{e.preventDefault();let url=$('#bookmarkUrl').value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;try{new URL(url);}catch{return showToast('请检查网址格式');}const item={...((editingIndex>=0&&state.bookmarks[editingIndex])||{}),name:$('#bookmarkName').value.trim(),url,category:$('#bookmarkCategory').value,icon:$('#bookmarkIcon').value.trim()};if(!item.name)return;if(editingIndex<0)state.bookmarks.push(item);else state.bookmarks[editingIndex]=item;save();renderBookmarks();renderDock();closeBookmark();showToast(editingIndex<0?'书签已添加':'书签已更新');});
$('#deleteBookmark').onclick=()=>{if(editingIndex<0)return;state.bookmarks.splice(editingIndex,1);save();renderBookmarks();renderDock();closeBookmark();showToast('书签已删除');};$('#closeBookmark').onclick=closeBookmark;$('#cancelBookmark').onclick=closeBookmark;$('#bookmarkOverlay').addEventListener('click',e=>{if(e.target===$('#bookmarkOverlay'))closeBookmark();});$('#settingsOverlay').addEventListener('click',e=>{if(e.target===$('#settingsOverlay'))closeSettings();});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#searchInput').value.trim();if(!q)return;const direct=/^(https?:\/\/|[\w-]+\.[\w.-]{2,})(\/.*)?$/i.test(q);window.open(direct?(q.startsWith('http')?q:'https://'+q):state.engine+encodeURIComponent(q),'_blank','noopener');});$('#engine').value=state.engine;$('#engine').onchange=e=>{state.engine=e.target.value;save();};$('#engine').oninput=e=>{const v=e.target.value;$('#engineMark').textContent=v.includes('baidu')?'百':v.includes('google')?'G':v.includes('duck')?'d':'b';};
let utilityMonth=new Date();
function openUtility(mode){const overlay=$('#utilityOverlay'),body=$('#utilityBody');overlay.classList.add('open');if(mode==='calendar'){utilityMonth=new Date();$('#utilityTitle').textContent='日历';renderCalendar();}else{$('#utilityTitle').textContent='批量编辑书签';body.innerHTML=`<p class="utility-note">每行填写一条书签，字段之间用 Tab 分隔：名称、网址、分类、图标。未填写图标可留空。</p><textarea class="bulk-editor" id="bulkEditor" spellcheck="false"></textarea><div class="utility-actions"><button class="cancel-btn" id="bulkCancel">取消</button><button class="save-btn" id="bulkSave">保存更改</button></div>`;$('#bulkEditor').value=state.bookmarks.map(b=>[b.name,b.url,b.category,b.icon||''].join('\t')).join('\n');$('#bulkCancel').onclick=closeUtility;$('#bulkSave').onclick=()=>{const lines=$('#bulkEditor').value.split(/\r?\n/).filter(line=>line.trim());const next=[];for(let i=0;i<lines.length;i++){const parts=lines[i].split('\t');if(parts.length<2||!parts[0].trim()||!parts[1].trim()){showToast(`第 ${i+1} 行缺少名称或网址`);return;}const old=state.bookmarks.find(item=>item.url===parts[1].trim())||state.bookmarks[i]||{};next.push({...old,name:parts[0].trim(),url:parts[1].trim(),category:parts[2]?.trim()||state.categories[0]?.name||'工具',icon:parts[3]?.trim()||''});}state.bookmarks=next;for(const b of next)if(!state.categories.some(cat=>cat.name===b.category))state.categories.push({name:b.category,icon:'✦'});save();renderRail();renderBookmarks();renderDock();closeUtility();showToast('书签批量更新完成');};}}
function renderCalendar(){const body=$('#utilityBody'),year=utilityMonth.getFullYear(),month=utilityMonth.getMonth(),today=new Date(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<span class="calendar-empty"></span>';for(let day=1;day<=days;day++){const isToday=year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate();cells+=`<span class="calendar-date ${isToday?'today':''}">${day}</span>`;}body.innerHTML=`<div class="calendar-nav"><button type="button" id="calendarPrev" aria-label="上个月">‹</button><strong>${year}年${month+1}月</strong><button type="button" id="calendarNext" aria-label="下个月">›</button></div><div class="calendar-grid"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>${cells}</div>`;$('#calendarPrev').onclick=()=>{utilityMonth=new Date(year,month-1,1);renderCalendar();};$('#calendarNext').onclick=()=>{utilityMonth=new Date(year,month+1,1);renderCalendar();};}
function closeUtility(){$('#utilityOverlay').classList.remove('open');}
$('#closeUtility').onclick=closeUtility;$('#utilityOverlay').addEventListener('click',e=>{if(e.target===$('#utilityOverlay'))closeUtility();});
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ziyou-bookmarks.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('数据已导出');}
$('#importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.bookmarks))throw new Error();state={...defaults,...data};save();renderBookmarks();renderDock();setWallpaper();renderSettings('data');showToast('数据已导入');}catch{showToast('导入失败：文件格式不正确');}};reader.readAsText(file);e.target.value='';});
$('#wallpaperFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('请选择图片文件');return;}if(file.size>2.5*1024*1024){showToast('图片过大，请选择 2.5 MB 以下的图片');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{state.wallpaper=reader.result;save();setWallpaper();showToast('已应用本地壁纸');};reader.readAsDataURL(file);e.target.value='';});
$('#railAdd').onclick=()=>openCategory();$('#dockAdd').onclick=()=>openBookmark();$('#dockHome').onclick=()=>{activeCategory='全部';renderRail();renderBookmarks();};$('#dockSearch').onclick=()=>$('#searchInput').focus();$('#dockEdit').onclick=()=>openUtility('batch');$('#dockSettings').onclick=()=>openSettings('wallpaper');$('#railSettings').onclick=()=>openSettings('shortcuts');$('#topBookmarkManage').onclick=()=>{activeCategory='全部';renderRail();renderBookmarks();$('#bookmarkGrid').scrollIntoView({behavior:'smooth',block:'start'});};$('#topWallpaper').onclick=()=>openSettings('wallpaper');$('#topCalendar').onclick=()=>openUtility('calendar');$('#topBatch').onclick=()=>openUtility('batch');$('#topSettings').onclick=()=>openSettings('shortcuts');$('#topExtensions').onclick=()=>showToast('浏览器扩展请从浏览器菜单中管理');$('#topAddCategory').onclick=openCategory;$('#dockClear').onclick=()=>{activeCategory='全部';renderRail();renderBookmarks();showToast('已显示全部书签；悬停图标可编辑');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSettings();closeBookmark();closeCategory();closeUtility();closeBookmarkContext();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus();}});
renderRail();renderBookmarks();renderDock();refreshBookmarkCategories();updateClock();setInterval(updateClock,1000);setWallpaper();$('#searchInput').autofocus=!!state.focusSearch;const day=new Date();$('#calendarWeekday').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'short'}).format(day);$('#calendarDay').textContent=String(day.getDate()).padStart(2,'0');
})();
</script>
