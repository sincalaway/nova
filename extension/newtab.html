<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#071323">
<title>岁瞬网页书签 · 新标签页</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="wallpaper" aria-hidden="true"></div><div id="shade" aria-hidden="true"></div>
<aside class="rail" aria-label="主导航">
  <a class="rail-brand" href="#home" title="岁瞬网页书签主页"><img src="logo.png" alt="岁瞬"></a>
  <nav class="rail-links" id="railLinks"></nav>
  <div class="rail-bottom">
    <button id="railAdd" type="button" title="添加文件夹" aria-label="添加文件夹"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>添加</span></button>
    <div class="rail-divider"></div>
    <button id="railSettings" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.7 2.94-.09-.02a1.7 1.7 0 0 0-1.72.6l-.05.07h-3.4l-.04-.09a1.7 1.7 0 0 0-1.5-1.04 1.7 1.7 0 0 0-.76.18l-.08.04-2.94-1.7.02-.09a1.7 1.7 0 0 0-.6-1.72l-.07-.05v-3.4l.09-.04a1.7 1.7 0 0 0 1.04-1.5 1.7 1.7 0 0 0-.18-.76l-.04-.08 1.7-2.94.09.02a1.7 1.7 0 0 0 1.72-.6l.05-.07h3.4l.04.09a1.7 1.7 0 0 0 1.5 1.04 1.7 1.7 0 0 0 .76-.18l.08-.04 2.94 1.7-.02.09a1.7 1.7 0 0 0 .6 1.72l.07.05v3.4z"/></svg><span>设置</span></button>
  </div>
</aside>
<main class="workspace" id="home">
  <nav class="top-toolbar" aria-label="快捷功能">
    <button class="tool-item" id="topBookmarkManage" type="button" title="管理和查看书签"><span class="tool-icon tool-coral"><svg viewBox="0 0 24 24"><path d="M7 3.8h10a1.8 1.8 0 0 1 1.8 1.8v14L12 16l-6.8 3.6v-14A1.8 1.8 0 0 1 7 3.8Z"/><path d="m12 6.5.7 1.6 1.7.2-1.3 1.1.4 1.7-1.5-.9-1.5.9.4-1.7-1.3-1.1 1.7-.2z"/></svg></span><span>书签管理</span></button>
    <button class="tool-item" id="topWallpaper" type="button" title="更换或调整壁纸"><span class="tool-icon tool-sunset"><svg viewBox="0 0 24 24"><circle cx="17.5" cy="5.5" r="2.4"/><path d="M3 18.5 8.2 10l3.2 4.1 2.1-2.7 7.5 7.1z"/><path d="M4 20h16"/></svg></span><span>背景设置</span></button>
    <button class="tool-item" id="topCalendar" type="button" title="打开日历"><span class="tool-icon tool-paper"><span class="calendar-mark"><b id="calendarWeekday">周五</b><strong id="calendarDay">06</strong></span></span><span>日历</span></button>
    <button class="tool-item" id="topBatch" type="button" title="批量编辑书签"><span class="tool-icon tool-sky"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 16 8-8M8.5 8.5h.01M15.5 15.5h.01"/></svg></span><span>批量编辑</span></button>
    <button class="tool-item" id="topSettings" type="button" title="打开系统设置"><span class="tool-icon tool-slate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.6 1.6 0 0 1-2.3 2.3l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.6 1.6 0 0 1-3.2 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.6 1.6 0 0 1-2.3-2.3l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4.4a1.6 1.6 0 0 1 0-3.2h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1A1.6 1.6 0 0 1 8 3.6l.1.1a1.7 1.7 0 0 0 2.9-1.2v-.2a1.6 1.6 0 0 1 3.2 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.6 1.6 0 0 1 2.3 2.3l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.6 1.6 0 0 1 0 3.2h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg></span><span>设置</span></button>
    <button class="tool-item" id="topExtensions" type="button" title="查看浏览器扩展管理方式"><span class="tool-icon tool-plum"><svg viewBox="0 0 24 24"><path d="M8 3.5H5.5A2.5 2.5 0 0 0 3 6v3.2h2a2 2 0 1 1 0 4H3V18a2.5 2.5 0 0 0 2.5 2.5H9v-2a2 2 0 1 1 4 0v2h5a2.5 2.5 0 0 0 2.5-2.5v-5h-2a2 2 0 1 1 0-4h2V6A2.5 2.5 0 0 0 18 3.5h-3.2v2a2 2 0 1 1-4 0v-2Z"/></svg></span><span>扩展</span></button>
    <button class="tool-item" id="topAddCategory" type="button" title="添加分类标签"><span class="tool-icon tool-paper tool-plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>添加标签</span></button>
  </nav>
  <section class="hero" aria-label="时间和搜索">
    <div class="clock" id="clock">19:12:49</div>
    <div class="date-line" id="dateLine"></div>
    <form class="search-shell" id="searchForm">
      <div class="engine-wrap"><span class="engine-mark" id="engineMark">b</span><select class="engine" id="engine" aria-label="搜索引擎"><option value="https://www.bing.com/search?q=">Bing</option><option value="https://www.google.com/search?q=">Google</option><option value="https://www.baidu.com/s?wd=">百度</option><option value="https://duckduckgo.com/?q=">DuckDuckGo</option></select></div>
      <input class="search-input" id="searchInput" autocomplete="off" placeholder="输入并搜索..." aria-label="搜索网页或输入网址">
      <button class="search-go" aria-label="搜索" title="搜索" type="submit"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button>
    </form>
  </section>
  <section class="bookmark-grid" id="bookmarkGrid" aria-label="我的书签"></section>
</main>
<div class="dock" aria-label="常用快捷操作"><div class="dock-bookmarks" id="dockBookmarks" aria-label="Dock 书签"></div>
  <button class="dock-btn" id="dockHome" title="显示全部书签" aria-label="显示全部书签"><img src="logo.png" alt="岁瞬"></button>
  <button class="dock-btn" id="dockSearch" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button>
  <button class="dock-btn" id="dockAdd" title="添加书签" aria-label="添加书签"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="dock-btn" id="dockEdit" title="导入或导出书签" aria-label="导入或导出书签"><svg viewBox="0 0 24 24"><path d="M4 19.5V20h16v-.5M7 16l5-5 5 5M12 11V3"/></svg></button>
  <span class="dock-sep"></span>
  <button class="dock-btn" id="dockSettings" title="壁纸设置" aria-label="壁纸设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.7 2.94-.09-.02a1.7 1.7 0 0 0-1.72.6l-.05.07h-3.4l-.04-.09a1.7 1.7 0 0 0-1.5-1.04 1.7 1.7 0 0 0-.76.18l-.08.04-2.94-1.7.02-.09a1.7 1.7 0 0 0-.6-1.72l-.07-.05v-3.4l.09-.04a1.7 1.7 0 0 0 1.04-1.5 1.7 1.7 0 0 0-.18-.76l-.04-.08 1.7-2.94.09.02a1.7 1.7 0 0 0 1.72-.6l.05-.07h3.4l.04.09a1.7 1.7 0 0 0 1.5 1.04 1.7 1.7 0 0 0 .76-.18l.08-.04 2.94 1.7-.02.09a1.7 1.7 0 0 0 .6 1.72l.07.05v3.4z"/></svg></button>
  <button class="dock-btn trash-btn" id="dockClear" title="整理书签" aria-label="整理书签">⌫</button>
</div>
<div class="chrome-foot"><a href="https://liukuan.cc/" target="_blank" rel="noopener">岁瞬网页书签</a><span> · 浏览器扩展版</span></div>
<div class="overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="设置">
  <div class="settings-dialog">
    <aside class="settings-nav">
      <div class="settings-profile"><img src="logo.png" alt=""><span>岁瞬网页书签</span></div>
      <nav class="setting-tabs" id="settingTabs"></nav>
    </aside>
    <section class="settings-content" id="settingsContent"></section>
  </div>
</div>
<div class="modal-backdrop" id="bookmarkOverlay" role="dialog" aria-modal="true" aria-labelledby="bookmarkModalTitle">
  <form class="bookmark-modal" id="bookmarkForm">
    <div class="modal-head"><h2 id="bookmarkModalTitle">添加书签</h2><button class="modal-close" type="button" id="closeBookmark" aria-label="关闭">×</button></div>
    <div class="field"><label for="bookmarkName">名称</label><input id="bookmarkName" maxlength="32" required placeholder="例如：工作台"></div>
    <div class="field"><label for="bookmarkUrl">网址</label><input id="bookmarkUrl" required placeholder="https://example.com" inputmode="url"></div>
    <div class="field-row"><div class="field"><label for="bookmarkCategory">分类</label><select id="bookmarkCategory"></select></div><div class="field"><label for="bookmarkIcon">图标 / Emoji</label><input id="bookmarkIcon" maxlength="5" placeholder="自动加载网站图标"></div></div>
    <div class="modal-actions"><button class="danger-btn" type="button" id="deleteBookmark">删除</button><button class="cancel-btn" type="button" id="cancelBookmark">取消</button><button class="save-btn" type="submit">保存</button></div>
  </form>
</div>
<div class="category-overlay" id="categoryOverlay" role="dialog" aria-modal="true" aria-labelledby="categoryTitle">
  <form class="category-card" id="categoryForm">
    <div class="category-head"><h2 id="categoryTitle">添加标签</h2><button type="button" class="category-close" id="closeCategory" aria-label="关闭">×</button></div>
    <label for="categoryIcon">文件夹图标</label><input id="categoryIcon" maxlength="5" value="✦" aria-label="文件夹图标">
    <label for="categoryName">文件夹名称</label><input id="categoryName" maxlength="16" required placeholder="请填写文件夹名称" aria-label="文件夹名称">
    <button class="category-save" id="categorySave" type="submit">保存</button>
  </form>
</div>
<div class="bookmark-context-menu" id="bookmarkContextMenu" role="menu" aria-label="书签操作" aria-hidden="true"></div>
<div class="utility-backdrop" id="utilityOverlay" role="dialog" aria-modal="true" aria-labelledby="utilityTitle"><section class="utility-card"><header class="utility-head"><h2 id="utilityTitle"></h2><button type="button" id="closeUtility" aria-label="关闭">×</button></header><div id="utilityBody"></div></section></div>
<input id="wallpaperFile" type="file" accept="image/*" hidden><input id="importFile" type="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
